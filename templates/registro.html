<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Personal - Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="contenedor">
        <h2>Crear Cuenta</h2>

        {% with mensajes = get_flashed_messages(with_categiries=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alerta-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('procesar_registro') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input
                type="text"
                name="nombre"
                placeholder="Nombre completo"
                required>

            <input
                type="email"
                name="correo"
                placeholder="Correo Electrónico"
                required>

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
                required>

            <button type="submit">Registrarse</button>
        </form>
        <p class="texto-enlace">¿Ya tienes cuenta? <a href="{{ url_for('vista_login') }}">Inicia Sesión</a></p>
    </div>
</body>
</html>
