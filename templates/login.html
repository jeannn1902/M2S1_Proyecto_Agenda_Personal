<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | AgendaX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-auth">

    <main class="contenedor contenedor-auth">

        <a href="{{ url_for('vista_inicio') }}" class="marca-auth">
            <span class="icono-marca">A</span>
            <span class="nombre-marca">Agenda<span class="marca-acento">X</span></span>
        </a>

        <div class="encabezado-auth">
            <h1>Bienvenido de nuevo</h1>
            <p>Inicia sesión para acceder a tu agenda.</p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alerta-{{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('procesar_login') }}" method="POST" class="form-auth">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="grupo-campo">
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required>
            </div>

            <button type="submit" class="boton-auth">Iniciar sesión</button>
        </form>

        <p class="texto-enlace">
            ¿No tienes cuenta? 
            <a href="{{ url_for('vista_registro') }}">Crear una cuenta</a>
        </p>

    </main>
    
</body>
</html>
